<!doctype html><meta charset="utf-8"><article><p style="text-align:center;"><img src="https://cdn.imweb.me/upload/S20220224fb2dc3639636b/5d3e8f685f4d8.png" class="fr-fic fr-dib" style="width:432px;" alt="5d3e8f685f4d8.png"></p><p><br></p><p style="text-align:center;">안녕하세요, <strong>시놀</strong>입니다!</p><p style="text-align:center;"><br></p><p style="text-align:center;">여러분, <strong>요양원과 요양병원의 차이점</strong>을 아시나요?</p><p style="text-align:center;">오늘은 시놀에서 요양원과 요양병원을 비교해서 알려드릴게요!</p><p style="text-align:center;"><br></p><p style="text-align:center;"><img src="https://cdn.imweb.me/upload/S20220224fb2dc3639636b/c272fd4401ace.png" class="fr-fic fr-dib" style="width:437px;" alt="c272fd4401ace.png"><img src="https://cdn.imweb.me/upload/S20220224fb2dc3639636b/d29eb7eafe11b.png" class="fr-fic fr-dib" style="width:437px;" alt="d29eb7eafe11b.png"></p><p><br></p><p style="text-align:center;">이제 구분이 되시나요?!</p><p style="text-align:center;"><br></p><p style="text-align:center;">거주형 서비스를 제공하는 <strong>요양원</strong>은 의료진이 상주하지 않고,</p><p style="text-align:center;">의료 서비스를 제공하는 <strong>요양병원</strong>은 의료진이 상주해 진료를 받을 수 있다는 것이죠!</p><p style="text-align:center;"><br></p><p style="text-align:center;"><img src="https://cdn.imweb.me/upload/S20220224fb2dc3639636b/43ee931705f24.png" class="fr-fic fr-dib" style="width:440px;" alt="43ee931705f24.png"></p><p><br></p><p style="text-align:center;">또한 이렇게 <strong>비용</strong>의 차이점도 있다는 점!</p><p style="text-align:center;"><br></p><p style="text-align:center;"><img src="https://cdn.imweb.me/upload/S20220224fb2dc3639636b/b3ba8456998bb.png" class="fr-fic fr-dib" style="width:445px;" alt="b3ba8456998bb.png"></p><p><br></p><p style="text-align:center;">오늘 <strong><u>시니어 놀이터 시놀</u></strong>과 함께 알아본 정보,</p><p style="text-align:center;">여러분께 도움이 되셨기를 바랍니다!</p></article>
