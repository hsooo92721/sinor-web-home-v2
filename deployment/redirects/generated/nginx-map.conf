  "~^/main/?\\?(?!.*bmode=view)" "/";
  "/company" "/company/";
  "~^/company/?\\?(?!.*bmode=view)" "/company/";
  "/download" "/download/";
  "~^/download/?\\?(?!.*bmode=view)" "/download/";
  "/silove" "/silove/";
  "~^/silove/?\\?(?!.*bmode=view)" "/silove/";
  "/moim" "/moim/";
  "~^/moim/?\\?(?!.*bmode=view)" "/moim/";
  "/information" "/columns/";
