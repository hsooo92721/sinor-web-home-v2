  "~^/information/?\\?(?!.*bmode=view)" "/columns/";
  "/terms" "/policy/terms/";
  "/terms/" "/policy/terms/";
  "~^/terms/?\\?(?!.*bmode=view)" "/policy/terms/";
  "/privacy" "/policy/privacy/";
  "/privacy/" "/policy/privacy/";
  "~^/privacy/?\\?(?!.*bmode=view)" "/policy/privacy/";
  "/travel-terms" "/policy/travel/";
