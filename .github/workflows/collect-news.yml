name: Collect Sinor news
on:
  schedule:
    # Daily lightweight check at 10:17 KST; collect according to cms/news-collection.json.
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-sinor-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check configured collection interval
        id: interval
        env:
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PYTHON'
          from datetime import datetime, timezone, timedelta
          import json, os
          from pathlib import Path
          state = json.loads(Path('.github/news-collection-state.json').read_text())
          settings = json.loads(Path('cms/news-collection.json').read_text())
          interval = settings['intervalDays']
          if type(interval) is not int or not 1 <= interval <= 365:
              raise ValueError('Invalid collection interval')
          last = datetime.fromisoformat(state['last_success_at'].replace('Z', '+00:00'))
          korea = timezone(timedelta(hours=9))
          due = os.environ['MANUAL_RUN'] == 'true' or (datetime.now(korea).date() - last.astimezone(korea).date()).days >= interval
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'due={str(due).lower()}\n')
          print('Collection due' if due else f'Skipped: collection interval is {interval} days')
          PYTHON
      - uses: actions/setup-python@v5
        if: steps.interval.outputs.due == 'true'
        with:
          python-version: '3.12'
      - name: Install preview resolver
        if: steps.interval.outputs.due == 'true'
        run: python -m pip install -r scripts/news-requirements.txt
      - name: Validate collector
        if: steps.interval.outputs.due == 'true'
        run: python -m unittest discover -s tests -p 'test_news*.py'
      - name: Collect latest Google News results (no API key)
        if: steps.interval.outputs.due == 'true'
        run: python scripts/collect-news.py --source google
      - name: Publish news data
        if: steps.interval.outputs.due == 'true'
        run: |
          python - <<'PYTHON'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          Path('.github/news-collection-state.json').write_text(json.dumps({
              'last_success_at': datetime.now(timezone.utc).isoformat()
          }, indent=2) + '\n')
          PYTHON
          git add company/news-data.json company/assets .github/news-collection-state.json
          if git diff --cached --quiet; then
            echo 'No new articles.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update collected Sinor news'
          git push
          echo 'Completed collection and saved the last successful run time.' >> "$GITHUB_STEP_SUMMARY"
