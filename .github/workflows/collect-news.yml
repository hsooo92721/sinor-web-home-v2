name: Collect Sinor news
on:
  schedule:
    # 09:17 and 18:17 Korea time; GitHub schedules may be delayed.
    - cron: '17 0,9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-sinor-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector
        run: python -m unittest discover -s tests -p 'test_news.py'
      - name: Check API configuration
        id: config
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          if [ -n "$NAVER_CLIENT_ID" ] && [ -n "$NAVER_CLIENT_SECRET" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Register NAVER_CLIENT_ID and NAVER_CLIENT_SECRET to enable live news collection.'
            echo 'Live collection is waiting for Naver API repository secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect latest news
        if: steps.config.outputs.ready == 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/collect-news.py
      - name: Publish news data
        if: steps.config.outputs.ready == 'true'
        run: |
          git add company/news-data.json
          if git diff --cached --quiet; then
            echo 'No new articles.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update collected Sinor news'
          git push
          echo 'Published new articles to company/news-data.json.' >> "$GITHUB_STEP_SUMMARY"
